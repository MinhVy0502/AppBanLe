# render.yaml — Cấu hình tự động deploy trên Render.com
# Push file này lên GitHub, Render sẽ tự detect và cấu hình

services:
  - type: web
    name: appbanle
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:frontend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: appbanle-db
          property: connectionString

databases:
  - name: appbanle-db
    plan: free
    databaseName: appbanle_db
