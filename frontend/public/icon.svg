<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#brandGrad)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6" />

  <!-- Modern Shopping Cart & Barcode Vector Symbol -->
  <g filter="url(#glow)" fill="white">
    <!-- Shopping cart base -->
    <path d="M128 144h48l38.4 168.8a16 16 0 0 0 15.6 12.4h176a16 16 0 0 0 15.6-12.4L448 208H200" fill="none" stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Wheels -->
    <circle cx="240" cy="384" r="28" fill="white" />
    <circle cx="384" cy="384" r="28" fill="white" />

    <!-- Barcode lines inside cart -->
    <rect x="252" y="196" width="12" height="72" rx="4" fill="white"/>
    <rect x="276" y="196" width="22" height="72" rx="4" fill="white"/>
    <rect x="310" y="196" width="10" height="72" rx="4" fill="white"/>
    <rect x="332" y="196" width="18" height="72" rx="4" fill="white"/>
    <rect x="362" y="196" width="12" height="72" rx="4" fill="white"/>
    <rect x="386" y="196" width="24" height="72" rx="4" fill="white"/>
  </g>
</svg>
